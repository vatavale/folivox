[project]
name = "folivox"
dynamic = ["version"]
description = "Turn e-books (FB2, EPUB, DOCX, PDF, TXT) into chaptered audiobooks locally with CosyVoice 3"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10,<3.13"
authors = [{ name = "vatavale" }]
keywords = ["audiobook", "tts", "cosyvoice", "fb2", "epub", "m4b", "russian"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Natural Language :: Russian",
]
# Core: readers, text processing, CLI. Light enough for CI on every OS.
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "lxml>=5",
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12",
    "python-docx>=1.1",
    "pymupdf>=1.24",
    "num2words>=0.5.13",
    "razdel>=0.5",
    "platformdirs>=4",
    "tomli>=2; python_version < '3.11'",
    "tomli-w>=1.0",  # config.toml writes: licence acceptance, settings
]

[project.optional-dependencies]
# Speech synthesis (CosyVoice 3, vendored) + stress marks.
tts = [
    # 2.7 only for RTX 50 (Blackwell, needs the cu128 build); the installers hold every other machine at <2.6
    "torch>=2.3,<2.8; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "torchaudio>=2.3,<2.8; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    # Intel Macs: PyTorch published no macOS x86_64 wheels after 2.2.2
    "torch>=2.2.2,<2.3; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "torchaudio>=2.2.2,<2.3; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "numpy<2",
    "onnxruntime>=1.18,<1.24",
    "transformers==4.51.3",
    "hyperpyyaml>=1.2",
    "omegaconf>=2.3",
    "x-transformers>=1.30",
    "einops>=0.8",
    "conformer==0.3.2",
    "diffusers==0.29.0",
    "librosa>=0.10",
    "scipy>=1.10",
    "tiktoken>=0.7",
    "inflect>=7",
    "regex",
    "soundfile>=0.12",
    "huggingface-hub>=0.24",
    "hf-xet>=1.0",
    "ruaccent>=1.5",
]
# Whisper-based quality check of each take.
qa = [
    "mlx-whisper>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "faster-whisper>=1.0; sys_platform != 'darwin' or platform_machine != 'arm64'",
]
# Optional noise reduction for voice samples.
denoise = ["noisereduce>=3"]
# Local web interface: `folivox ui`.
ui = [
    "noisereduce>=3",
    "starlette>=0.37",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "tomli-w>=1.0",
    "keyring>=25",   # API keys entered in the UI go to the OS keychain, never to a file
]
# Claude through Anthropic's own API: `--llm anthropic` for the markup (your key, billed to your account).
anthropic = ["anthropic>=2.0"]
all = ["folivox[tts,qa,ui,denoise,anthropic]"]

[project.scripts]
folivox = "folivox.cli:main"

[project.urls]
Homepage = "https://github.com/vatavale/folivox"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]
# what the unit tests need beyond the core (no torch)
test = ["numpy<2", "soundfile>=0.12", "scipy>=1.10", "httpx>=0.27", "huggingface_hub>=0.24", "anthropic>=2.0"]

[tool.uv]
default-groups = ["dev", "test"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/folivox/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/folivox"]

[tool.ruff]
line-length = 120
extend-exclude = ["src/folivox/vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008", "E731"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:importlib._bootstrap"]
